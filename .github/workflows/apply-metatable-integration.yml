name: Apply MetaTable integration

on:
  push:
    branches:
      - fix/metatable-pca-power-cluster
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-main-pipeline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/metatable-pca-power-cluster
      - name: Add MetaTable enrichment call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mainPipeline.m')
          text = path.read_text()
          old = """            MetaTable = buildBlockMetadata(behavioralData, bitmapData, columnsDesired, columnSpread, ...
                blockData, datastruct, analysisBlockID, mdlStruct);"""
          addition = """
            MetaTable = addMetaTablePcaPowerCluster(MetaTable, bitmapData, mdlStruct, ...
                datastruct, analysisBlockID, columnsDesired);"""
          if addition.strip() in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected MetaTable call site was not found.')
          path.write_text(text.replace(old, old + addition, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mainPipeline.m
          git commit -m "Wire MetaTable PCA and power-cluster enrichment"
          git push origin HEAD:fix/metatable-pca-power-cluster
